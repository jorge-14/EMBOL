spring.application.name=back-office-api

# H2
spring.datasource.url=jdbc:h2:mem:backofficedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Microsoft Entra ID
entra.tenant-id=93294bfd-d915-45bf-884f-787290ec034d
entra.client-id=5f0872cd-df06-4ab5-89f7-d04a5c0fbd50
entra.client-secret=${ENTRA_CLIENT_SECRET}

# OAuth2 Login
spring.security.oauth2.client.registration.entra.client-id=${entra.client-id}
spring.security.oauth2.client.registration.entra.client-secret=${entra.client-secret}
spring.security.oauth2.client.registration.entra.scope=openid,profile,email
spring.security.oauth2.client.registration.entra.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.entra.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.entra.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.entra.issuer-uri=https://login.microsoftonline.com/${entra.tenant-id}/v2.0
# OAuth2 Resource Server - JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${entra.tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${entra.client-id}

# Logs
logging.level.org.springframework.security=DEBUG
