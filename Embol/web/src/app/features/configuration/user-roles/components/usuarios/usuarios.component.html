<!-- Filtros Especiales -->
<div class="flex flex-col md:flex-row gap-4 mb-4 items-end">
  <app-horizontal-select
    label="Filtrar por Rol"
    placeholder="Todos los roles"
    [options]="roleOptions"
    [(value)]="roleFilter"
  ></app-horizontal-select>

  <app-horizontal-select
    label="Filtrar por Grupo"
    placeholder="Todos los grupos"
    [options]="groupOptions"
    [(value)]="groupFilter"
  ></app-horizontal-select>

  <div class="flex gap-2">
    <button (click)="onSearch()" class="px-4 py-2 bg-brand text-white rounded-md hover:bg-brand-hover transition-colors font-medium">
      Buscar
    </button>
    <button (click)="onClear()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">
      Limpiar
    </button>
  </div>
  
  <div class="ml-auto">
    <button (click)="onAdd()" class="bg-brand text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-brand-hover transition-colors shadow-sm">
      <span class="text-lg leading-none">+</span> Nuevo Usuario
    </button>
  </div>
</div>

@if (loading()) {
  <div class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand"></div>
    <span class="ml-3 text-sm text-gray-500">Cargando usuarios...</span>
  </div>
} @else {
  <app-data-table
    [data]="users()"
    [columns]="columns"
    [rowActions]="rowActions"
    [trackByKey]="'id'"
    [showFilter]="true"
    [showPagination]="true"
    [pageInfo]="pageInfo()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
  </app-data-table>
}

@if (newUserModalConfig()) {
  <app-dynamic-form
    [config]="newUserModalConfig()!"
    [isOpen]="isNewUserModalOpen()"
    (formSubmit)="onNewUserSubmit($event)"
    (close)="onNewUserCancel()"
  ></app-dynamic-form>
}
