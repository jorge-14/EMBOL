@if (loading()) {
  <div class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand"></div>
    <span class="ml-3 text-sm text-gray-500">Cargando grupos...</span>
  </div>
} @else {
  <div class="flex justify-end mb-4">
    <button (click)="onAdd()" class="bg-brand text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-brand-hover transition-colors shadow-sm">
      <span class="text-lg leading-none">+</span> Nuevo Grupo
    </button>
  </div>
  
  <app-data-table
    [data]="groups()"
    [columns]="columns"
    [rowActions]="rowActions"
    [trackByKey]="'id'"
    [showFilter]="true"
    [showPagination]="true"
    [pageInfo]="pageInfo()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
  </app-data-table>
}

@if (newGroupModalConfig()) {
  <app-dynamic-form
    [config]="newGroupModalConfig()!"
    [isOpen]="isNewGroupModalOpen()"
    (formSubmit)="onNewGroupSubmit($event)"
    (close)="onNewGroupCancel()"
  ></app-dynamic-form>
}
