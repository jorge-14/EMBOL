<div class="flex justify-end mb-4">
  <button (click)="onAdd()" class="bg-brand text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-brand-hover transition-colors shadow-sm">
    <span class="text-lg leading-none">+</span> Nuevo Grupo
  </button>
</div>

<app-data-table
  [data]="groups()"
  [columns]="columns"
  [rowActions]="rowActions"
  [trackByKey]="'id'"
  [showFilter]="true"
  [showPagination]="true"
  [pageInfo]="pageInfo()"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
>
</app-data-table>

@if (groupModalConfig()) {
  <app-dynamic-form
    [config]="groupModalConfig()!"
    [isOpen]="isGroupModalOpen()"
    [initialData]="groupModalData()"
    (formSubmit)="onGroupSubmit($event)"
    (close)="onGroupCancel()"
  ></app-dynamic-form>
}

<app-confirm-modal
  [config]="confirmModalConfig()"
  [isOpen]="isConfirmModalOpen()"
  (confirm)="onConfirmDelete()"
  (close)="onConfirmCancel()"
></app-confirm-modal>

@if (loading()) {
  <app-loading-screen [isLoading]="true" text="Procesando..."></app-loading-screen>
}
