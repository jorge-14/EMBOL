
<!-- ═══════════════════════════════════════
     USER LIST PAGE — Listado de Usuarios
     ═══════════════════════════════════════ -->

<div class="max-w-7xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Usuarios</h1>
      <p class="mt-2 text-sm text-gray-600">Gestión de usuarios del sistema.</p>
    </div>
  </div>

  <!-- Error State -->
  @if (error()) {
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
      <div class="flex">
        <svg class="h-5 w-5 text-red-400 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800">Error al cargar usuarios</h3>
          <p class="mt-1 text-sm text-red-700">{{ error() }}</p>
        </div>
      </div>
    </div>
  }

  <!-- Loading State -->
  @if (loading()) {
    <div class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    </div>
  }

  <!-- Data Table -->
  @if (!loading() && !error() && usersData()) {
    <app-data-table
      [data]="usersData()?.content || []"
      [columns]="columns()"
      [showPagination]="true"
      [pageInfo]="usersData()?.page || null"
      [trackByKey]="'id'"
      [showCustomFilters]="true"
      [showFilter]="true"
      (pageChange)="changePage($event)"
      (pageSizeChange)="changePageSize($event)"
      (filterChange)="onSearch($event)"
    >
      <div table-filters class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full lg:w-[60%] items-center">
        <app-horizontal-select
          class="flex-1 min-w-[200px]"
          label="Rol:"
          [options]="roleOptions"
          [(value)]="roleFilter"
          placeholder="Todos los roles"
        ></app-horizontal-select>

        <app-horizontal-multi-select
          class="flex-1 min-w-[200px]"
          label="Estado:"
          [options]="statusOptions"
          [(value)]="statusFilter"
        ></app-horizontal-multi-select>

        <div class="flex items-center ml-2">
          <button
            (click)="clearFilters()"
            class="px-4 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
          >
            Limpiar
          </button>
        </div>
      </div>
    </app-data-table>
  }
</div>
