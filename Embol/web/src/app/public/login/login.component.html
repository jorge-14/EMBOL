<div class="flex min-h-screen bg-gray-50">
  <!-- Brand Side: Red box on large screens -->
  <div class="hidden lg:flex lg:w-1/2 bg-red-600 items-center justify-center p-12 text-white">
    <div class="max-w-md">
      <h1 class="text-4xl font-bold mb-6">Bienvenido a EMBOL</h1>
      <p class="text-lg mb-8">Inicia sesión para acceder a tu plataforma de gestión y operaciones.</p>
      <!-- Optional logo or brand graphic here -->
      <div class="w-full h-64 bg-white/10 rounded-xl backdrop-blur-sm border border-white/20 flex items-center justify-center">
        <i class="pi pi-bolt text-6xl text-white/80"></i>
      </div>
    </div>
  </div>

  <!-- Form Side -->
  <div class="flex flex-col justify-center items-center w-full lg:w-1/2 p-8 sm:p-12">
    <div class="w-full max-w-md space-y-8">
      <div class="text-center lg:text-left">
        <h2 class="text-3xl font-extrabold text-gray-900">Iniciar Sesión</h2>
        <p class="mt-2 text-sm text-gray-600">
          Autentícate de forma segura con tu cuenta corporativa.
        </p>
      </div>

      <div class="mt-8 space-y-6">
        <!-- Entra ID Login Button -->
        <button 
          (click)="login()"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          <i class="pi pi-microsoft mr-2 text-lg"></i>
          Ingresar con Microsoft Entra ID
        </button>

        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-gray-50 text-gray-500">
              O con credenciales
            </span>
          </div>
        </div>

        <!-- Classic Form (Visual purposes or fallback) -->
        <form class="space-y-6" action="#" method="POST">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
            <div class="mt-1">
              <input id="username" name="username" type="text" autocomplete="username" required 
                class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
            <div class="mt-1">
              <input id="password" name="password" type="password" autocomplete="current-password" required 
                class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input id="remember-me" name="remember-me" type="checkbox" 
                class="h-4 w-4 text-red-600 focus:ring-red-500 border-gray-300 rounded">
              <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                Recordarme
              </label>
            </div>
          </div>

          <div>
            <button type="button" 
              class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
              Ingresar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
