<!-- ═══════════════════════════════════════
     HEADER — Breadcrumb + Badges + User
     ═══════════════════════════════════════ -->

<header class="bg-brand text-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm">

  <!-- ── Left: Breadcrumb ── -->
  <nav class="flex items-center text-sm">
    @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
      @if (!last) {
        <span class="text-white/70 hover:text-white cursor-default transition-colors">{{ crumb.label }}</span>
        <svg class="w-4 h-4 mx-2 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      } @else {
        <span class="text-white font-semibold">{{ crumb.label }}</span>
      }
    }
  </nav>

  <!-- ── Right: Badges + Export + User ── -->
  <div class="flex items-center gap-3">
    <!-- Badges / Chips -->
    @for (badge of badges(); track badge.label) {
      <span
        class="px-3 py-1 text-xs font-semibold rounded-full"
        [ngClass]="badge.colorClass"
      >
        {{ badge.label }}
      </span>
    }

    <!-- Export Button -->
    <button
      class="p-2 rounded-lg text-white/80 hover:bg-brand-hover hover:text-white transition-colors"
      title="Exportar"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    </button>

    <!-- Divider -->
    <div class="w-px h-8 bg-white/20"></div>

    <!-- User Section -->
    <div class="relative">
      <button
        (click)="toggleUserMenu()"
        class="flex items-center gap-2 px-2 py-1 rounded-lg hover:bg-brand-hover transition-colors"
      >
        <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm">
          <span class="text-brand text-xs font-bold">{{ userInitials() }}</span>
        </div>
        <span class="text-sm font-medium text-white hidden md:inline">{{ userName() }}</span>
        <svg class="w-4 h-4 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown menu -->
      @if (showUserMenu()) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
          <div class="border-t border-gray-100 my-1"></div>
          <button
            (click)="logout()"
            class="w-full text-left px-4 py-2 text-sm text-brand hover:bg-gray-50"
          >
            Cerrar Sesión
          </button>
        </div>
      }
    </div>
  </div>

</header>
