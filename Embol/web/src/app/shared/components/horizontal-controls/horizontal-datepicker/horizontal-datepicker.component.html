<div class="flex items-center gap-2 relative">
  @if (label()) {
    <label [for]="id()" class="text-sm font-semibold text-gray-700 whitespace-nowrap">
      {{ label() }}
    </label>
  }
  <div class="relative w-full min-w-[12rem]">
    <button type="button" (click)="toggleOpen()" class="w-full bg-white border border-gray-300 rounded-md shadow-sm pl-3 pr-10 py-1.5 text-left cursor-default focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      <span class="block truncate">
        @if (!value()) {
          <span class="text-gray-500">{{ placeholder() }}</span>
        } @else {
          {{ formatDisplayDate() }}
        }
      </span>
      <span class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </span>
    </button>

    @if (isOpen()) {
      <div class="absolute z-50 mt-1 w-64 bg-white shadow-lg rounded-md p-3 ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm flex flex-col">
        <!-- Calendar Header -->
        <div class="flex items-center justify-between mb-2">
          <button type="button" (click)="prevMonth()" class="p-1 hover:bg-gray-100 rounded-full">
            <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="15 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="text-sm font-bold text-gray-800 capitalize">
            {{ viewDate().monthName }} {{ viewDate().year }}
          </div>
          <button type="button" (click)="nextMonth()" class="p-1 hover:bg-gray-100 rounded-full">
            <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- Week Days -->
        <div class="grid grid-cols-7 gap-1 mb-1">
          @for (wd of weekDays; track wd) {
            <div class="text-center text-xs font-semibold text-gray-400 py-1">
              {{ wd }}
            </div>
          }
        </div>

        <!-- Days Grid -->
        <div class="grid grid-cols-7 gap-1">
          @for (item of daysInMonth(); track $index) {
            @if (item.day) {
              <button type="button"
                      (click)="selectDate(item.dateStr)"
                      [class.bg-blue-600]="isSelected(item.dateStr)"
                      [class.text-white]="isSelected(item.dateStr)"
                      [class.text-blue-600]="isToday(item.dateStr) && !isSelected(item.dateStr)"
                      [class.font-bold]="isToday(item.dateStr)"
                      class="text-center py-1.5 rounded-md hover:bg-blue-50 text-sm transition-colors duration-200">
                {{ item.day }}
              </button>
            } @else {
              <div class="py-1.5"></div>
            }
          }
        </div>

        <!-- Footer -->
        <div class="mt-2 pt-2 border-t border-gray-100 flex justify-end">
          <button type="button" (click)="clear()" class="text-xs text-red-600 hover:text-red-800 font-medium">
            Limpiar
          </button>
        </div>
      </div>
    }
  </div>
</div>
