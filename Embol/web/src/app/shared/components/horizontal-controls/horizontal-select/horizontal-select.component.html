<div class="flex items-center gap-2 relative">
  @if (label()) {
    <label [for]="id()" class="text-sm font-semibold text-gray-700 whitespace-nowrap">
      {{ label() }}
    </label>
  }
  <div class="relative w-full min-w-[12rem]">
    <button type="button" (click)="toggleOpen()" class="w-full bg-white border border-gray-300 rounded-md shadow-sm pl-3 pr-10 py-1.5 text-left cursor-default focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      <span class="block truncate">
        @if (value() === null || value() === undefined || value() === '') {
          <span class="text-gray-500">{{ placeholder() }}</span>
        } @else {
          {{ getDisplayValue() }}
        }
      </span>
      <span class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 3a1 1 0 01.707.293l3 3a1 1 0 01-1.414 1.414L10 5.414 7.707 7.707a1 1 0 01-1.414-1.414l3-3A1 1 0 0110 3zm-3.707 9.293a1 1 0 011.414 0L10 14.586l2.293-2.293a1 1 0 011.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </span>
    </button>

    @if (isOpen()) {
      <div class="absolute z-50 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none sm:text-sm flex flex-col">
        <!-- Buscador -->
        <div class="p-2 border-b border-gray-100 sticky top-0 bg-white z-10">
          <input type="text" [(ngModel)]="searchText" (click)="$event.stopPropagation()" placeholder="Buscar opción..." class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        
        <!-- Opción para deseleccionar / Placeholder -->
        <div (click)="selectOption(null)" class="text-gray-500 italic cursor-pointer select-none relative py-2 pl-3 pr-4 hover:bg-gray-50">
          {{ placeholder() }}
        </div>

        @for (option of filteredOptions(); track option.value) {
          <div (click)="selectOption(option)" class="text-gray-900 cursor-pointer select-none relative py-2 pl-3 pr-4 hover:bg-blue-50 flex items-center gap-3">
            <span class="font-normal block truncate" [class.font-semibold]="value() === option.value">
              {{ option.label }}
            </span>
          </div>
        }

        @if (filteredOptions().length === 0) {
          <div class="py-2 px-3 text-gray-500 text-sm">No se encontraron resultados</div>
        }
      </div>
    }
  </div>
</div>
